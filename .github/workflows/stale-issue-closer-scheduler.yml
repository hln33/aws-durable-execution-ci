name: Stale Issue Closer Scheduler

on:
  schedule:
    # GitHub can delay scheduled workflows, and may drop queued runs during high-load periods. 
    # Avoid scheduling at the top of the hour to reduce that risk: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
    # Run everyday at 12:37.
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: hln33/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@feature/stale-issue-closer
    with:
      days-until-close: 14
      close-reason: not_planned
